name: 'Process Issue Form Data'
description: 'Safely extract form data from GitHub issue body'
inputs:
  issue-body:
    description: 'The issue body content'
    required: true
  github-repository:
    description: 'The GitHub repository name'
    required: true
outputs:
  mode:
    description: 'Release Mode'
  status:
    description: 'Release Status'  
  sequence:
    description: 'Sequence Name'
  description:
    description: 'Description of the Release'
  changes:
    description: 'Link to Changes'
  first-release:
    description: 'Is this the first release'
  title:
    description: 'Title for first release'
  category:
    description: 'Category for first release'
  introduction:
    description: 'Introduction for first release'
  ci-build-url:
    description: 'CI build URL'
runs:
  using: 'node16'
  main: 'index.js'